name: build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - run: npm run generate
