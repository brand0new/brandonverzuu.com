<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t">
  <title id="t">Three overlapping circles: I understand it well enough to verify it; It's repetitive or tedious; It's cheap to be wrong. Where all three overlap: hand it over.</title>
  <rect width="640" height="520" fill="#eef4f6"/>
  <g fill="#d97a4d" fill-opacity="0.16" stroke="#ac4019" stroke-width="3">
    <circle cx="245" cy="205" r="150"/>
    <circle cx="395" cy="205" r="150"/>
    <circle cx="320" cy="335" r="150"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f1a1d" text-anchor="middle">
    <text x="172" y="150">I understand</text>
    <text x="172" y="174">it well enough</text>
    <text x="172" y="198">to verify it</text>
    <text x="468" y="162">It's repetitive</text>
    <text x="468" y="186">or tedious</text>
    <text x="320" y="420">It's cheap</text>
    <text x="320" y="444">to be wrong</text>
  </g>
  <circle cx="320" cy="252" r="44" fill="#beff33" stroke="#0f1a1d" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f1a1d" text-anchor="middle">
    <text x="320" y="248">Hand it</text>
    <text x="320" y="267">over</text>
  </g>
</svg>
