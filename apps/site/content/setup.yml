# The /setups page: the workflows I use, each drawn as its own diagram under its own heading,
# in the order listed under `flows`. In a flow, stages are the generic phases and steps are
# how that workflow does them. A step's `kinds` say what does the work (manual, hook, skill,
# script, agent; src/lib/setupKinds.ts) and are drawn as icons on its node. Read by
# src/pages/setups.astro through the `setup` schema in src/content.config.ts. A flow's `id` is its anchor (/setups#<id>) and must be unique.
#
# Every `path` under `sources` is relative to the repo root and must exist, or the build
# fails (src/lib/setup.ts). The page links each one to GitHub at the commit being built.

intro: How I build and ship things, one workflow at a time. Each runs from idea to production. Pick a step to see how it works and where it lives in the repo.

flows:
  - id: this-site
    name: This site
    description: How I develop this repository, from a note on my phone to a page in production and a post to share. Mostly agents, one question for me, two checks, and no deploy button.
    stages:
      - name: Plan & capture
        steps:
          - name: Capture a note
            kinds: [manual]
            tools: [Apple Notes, Shortcuts, GitHub Issues]
            body:
              - Most articles start as a few lines typed with my thumb. A Shortcut on my iPhone sends the note to GitHub as an issue labelled draft-article. A link I want to keep goes the same way as draft-bookmark, and a project as draft-project.
              - The Shortcut's token can file issues on this one repo and nothing else. It can never touch code, which is what I want from a credential that syncs through iCloud.
            sources:
              - label: Shortcut and token setup
                path: docs/content-workflow.md

          - name: Trigger and claim
            kinds: [hook, agent, skill]
            tools: [GitHub Actions, Claude Code, gh CLI]
            body:
              - The label starts a GitHub Action, and the Action starts an agent. Nothing polls, and nothing waits for me to open a laptop.
              - A run only starts for an issue that I opened and that carries an inbox label. A label alone isn't enough, because anyone with triage access can add one. What the issue says is source material, never instructions.
              - Before doing anything else, the agent adds in-progress as a lock. Two runs never work on the same note.
            sources:
              - label: Inbox workflow
                path: .github/workflows/content-inbox.yml
              - label: Inbox protocol
                path: skills/content-inbox/SKILL.md
              - label: Trust boundary
                path: AGENTS.md

          - name: Outline and questions
            kinds: [agent, manual]
            tools: [GitHub Issues]
            body:
              - Before a thousand words exist, the agent replies on the issue with a title, the angle in one sentence, the sections, and whatever it can't know without asking me.
              - I answer from my phone. A changed angle, a dropped section, or just "go". My reply starts the second run, and it outranks the outline.
              - It's the one place I'm asked anything, and the cheapest place to steer.
            sources:
              - label: Note to article
                path: skills/note-to-article/SKILL.md

      - name: Build & draft
        steps:
          - name: Shared context
            kinds: [skill]
            tools: [AGENTS.md, Skills]
            body:
              - Every agent starts from the same two places. AGENTS.md says what the repo is and what it cares about. The skills folder holds the procedures.
              - The skills are written so that any coding agent can follow them. When one is wrong, the fix goes into the skill, not into one agent's memory.
            sources:
              - label: AGENTS.md
                path: AGENTS.md
              - label: Skills
                path: skills

          - name: One workspace per task
            kinds: [agent]
            tools: [Git worktrees, GitHub Actions, Claude Code]
            body:
              - Each task gets its own branch in its own checkout. On my machine that's a git worktree per task. In the Action it's a fresh runner per issue.
              - Parallel agents never share files, so they can't step on each other. Branch and commit names follow one pattern, which keeps the history readable when most of it is written by agents.
            sources:
              - label: Branch and commit rules
                path: skills/ship-change/SKILL.md

          - name: Research
            kinds: [agent, skill]
            tools: [Web search, Primary sources]
            body:
              - With the outline agreed, the agent looks up what the piece leans on. The specification itself, the report itself, the talk. A summary of a source isn't the source.
              - It also checks what my note claims about public things, because I type notes from memory.
              - Research can supply a number or a quote. It can never supply what I did or what I think.
            sources:
              - label: Research and fact-check
                path: skills/fact-check/SKILL.md

          - name: Draft and cover
            kinds: [agent, skill, script]
            tools: [Style guide, sharp, Bayer dither]
            body:
              - The agent ghostwrites the full article from the note and my reply, measured against a style guide derived from everything I've published. Structure and analogies it may invent. Facts, numbers and anything I did, never.
              - The cover is dithered from a source image by a script, in the same terracotta palette the site uses.
              - Bookmarks and projects skip the writing. Each is one entry in a data file.
            sources:
              - label: Style guide
                path: skills/note-to-article/style-guide.md
              - label: Note to article
                path: skills/note-to-article/SKILL.md
              - label: Cover script
                path: apps/site/scripts/generate-cover.mjs
              - label: New bookmark
                path: skills/new-bookmark/SKILL.md
              - label: New project
                path: skills/new-project/SKILL.md

          - name: Explainer
            kinds: [agent, skill, script]
            tools: [Playwright, ffmpeg]
            body:
              - A technical article gets a short looping animation above the text. One idea in about six scenes, ending on a before and after.
              - The agent writes the story as code and a script renders it frame by frame. If it can't be rendered, the article ships without it. The explainer never holds an article back.
            sources:
              - label: Explainer skill
                path: skills/article-explainer/SKILL.md
              - label: Drawing kit and stories
                path: apps/site/scripts/explainers

      - name: Test & quality
        steps:
          - name: Fingerprint scrub
            kinds: [script]
            tools: [Node.js]
            body:
              - A deterministic pass over every model-written draft. It measures sentence rhythm, punctuation and filler phrases against my own articles and reports what drifts.
              - It works the same whichever model wrote the draft, which is the point.
            sources:
              - label: Scrub script
                path: apps/site/scripts/scrub-fingerprint.mjs
              - label: Scrub skill
                path: skills/fingerprint-scrub/SKILL.md

          - name: Fact-check
            kinds: [agent, script]
            tools: [Node.js, Source list]
            body:
              - Every checkable claim in the draft has to trace back to my note, to my reply, or to a source the agent actually opened. What doesn't is cut or asked about.
              - A script then requests every link once. A broken one doesn't ship.
              - Nobody reviews an article before it merges, so the pull request lists where each fact came from.
            sources:
              - label: Research and fact-check
                path: skills/fact-check/SKILL.md
              - label: Link check
                path: apps/site/scripts/check-links.mjs

          - name: Build-time checks
            kinds: [script]
            tools: [Astro, Zod, WCAG AA]
            body:
              - The build is the test suite. Content must match its schema, every colour pair must pass WCAG AA in both themes, and every URL the site has served must still exist.
              - Any of those failing fails npm run generate, so it never gets as far as a deploy.
            sources:
              - label: Content schemas
                path: apps/site/src/content.config.ts
              - label: Contrast check
                path: apps/site/scripts/check-contrast.mjs
              - label: URL check
                path: apps/site/scripts/check-urls.mjs

          - name: Required check
            kinds: [hook]
            tools: [GitHub Actions]
            body:
              - Every pull request runs the same build on a clean Linux runner. Master requires it to pass, so a red build can't be merged.
              - There's no human review gate. This check is the gate.
            sources:
              - label: Build workflow
                path: .github/workflows/build.yml

      - name: Release & operate
        steps:
          - name: Preview
            kinds: [hook]
            tools: [Cloudflare Pages]
            body:
              - Cloudflare builds every pushed branch and posts a preview link on the pull request. Anything visual gets looked at there before it merges.
            sources:
              - label: Deployment
                path: docs/deployment.md
              - label: Pages config
                path: wrangler.toml

          - name: Merge is publish
            kinds: [agent]
            tools: [GitHub, Cloudflare Pages]
            body:
              - Master is production. Squash-merging a pull request is the only publish step, and Cloudflare deploys it within a minute or two.
              - The site is fully static. No server runs at request time, so there's nothing else to deploy.
            sources:
              - label: Ship a change
                path: skills/ship-change/SKILL.md
              - label: Deployment
                path: docs/deployment.md

          - name: Share it
            kinds: [agent, manual]
            tools: [LinkedIn, GitHub Issues]
            body:
              - Once the page is live, the agent drafts the LinkedIn post and leaves it on the issue, next to the link.
              - It may only say what the article says. And I post it myself. Anything that goes out under my name on someone else's platform goes out by my hand.
            sources:
              - label: Social post
                path: skills/social-post/SKILL.md

          - name: Clean up
            kinds: [skill]
            tools: [Git]
            body:
              - After a merge the agent closes the issue and removes its worktree, its local branch and the build output. An idle clone holds the source and nothing else.
              - Then the next note comes in, and the loop starts again.
            sources:
              - label: Workspace cleanup
                path: skills/workspace-cleanup/SKILL.md
