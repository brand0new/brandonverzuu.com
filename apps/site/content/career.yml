# Source for /career (the `career` collection in src/content.config.ts). Employers are
# listed newest first, roles within an employer newest first. Dates are "YYYY-MM"; leave
# `end` out for a current role. Durations and the counts in the page head are calculated
# from these dates by the page, never written here. Brandon's words, from his LinkedIn
# profile: agents don't add roles, dates or claims.
intro:
  - Bringing people and technology together toward a shared goal only works with a clear and inspiring vision.
  - At many companies, tension grows between that vision and day-to-day practice. Somewhere along the way the original goal gets lost, and so does the drive that came with it.
  - A vision that's carried well, backed by IT that's applied effectively, is the deciding factor. Whatever the size of the organisation.
  - I combine creativity and an entrepreneurial streak with more than 10 years in IT to find that vision again, and to express it through successful products and services.

location: Rosmalen, NL

# Slugs from src/lib/topicClusters.ts, in the order the page lists them. Each links to
# /articles?topic=<slug> with a live article count.
topics:
  - integration-architecture
  - apis
  - ai

