# Side projects and programmes from LinkedIn, newest first. `end` is left out for one that
# is still running; `url` only where LinkedIn lists one.
projects:
  - title: API Conventions
    start: "2024-11"
    summary: Turning AppyThings' documentation on API development guidelines and Apigee proxy design into a contemporary solution. Open-source tools validate the specifications common in cloud integration projects, starting with AppyThings rulesets for the OpenAPI Specification and Apigee proxy design. The aim is one place for rule definitions, documentation and governance that any organisation can use, whatever its operating model for API development.
  - title: Integration Architecture Framework
    start: "2022-09"
    summary: A framework I created within AppyThings, offered both as a product and as a professional service for organisations that need help executing their integration strategy. It combines our expertise with ideas from thought leaders on integration into a guide for identifying integration challenges and finding a matching pattern. Applying it at clients, development teams and management introduce a small change to how they work that greatly improves knowledge handover and decision logging.
  - title: brandonverzuu.com
    start: "2022-01"
    url: https://brandonverzuu.com
    summary: My own domain, with every application and all the infrastructure behind it, maintained for personal development and branding. It lets me build and keep skills I can't apply directly in my daily work, and it's where I write about subjects I find interesting.
  - title: Integration and delivery automation
    start: "2018-02"
    summary: Finding a viable way to apply continuous integration and delivery to the Blueriq Modeling Platform, whose models are executed by a runtime and so call for their own approach to engineering and delivery. The goal was to prove the added value and shorter lead times, with evidence that application quality doesn't deteriorate over time.
    tags:
      - Jenkins
      - Apache Maven
      - SonarQube
      - Product risk management
      - Test automation
      - ReadyAPI
  - title: Blueriq Academy
    start: "2016-09"
    end: "2016-11"
    url: https://www.blueriq.com/academy/
    summary: An intensive training programme, run by Blueriq with CGI, in which 14 selected professionals trained for the Blueriq Associate certificate. It honed my Blueriq skills alongside knowledge- and decision-driven process development.
    tags:
      - Blueriq Modeling Foundation
      - Robust modelling
      - Decision Management
      - Dynamic Case Management
  - title: ICT Honours Programme 2013/2014
    start: "2013-10"
    summary: An extra semester added to the second year at Avans Hogeschool, in which a select group of students took extra lectures and extracurricular activities.
  - title: Application development with DSDM
    start: "2013-11"
    end: "2014-01"
    summary: A student team project building an administrative application for a fictional sports organisation with Visual Studio LightSwitch and SQL Server, through all five phases of the Dynamic System Development Method, from feasibility study to implementation.
  - title: NewFlys
    start: "2012-09"
    end: "2013-01"
    url: http://www.newflys.nl/html
    summary: A webshop built in PHP, HTML and CSS during the first year of Business Informatics & Management, where I also led the team.

